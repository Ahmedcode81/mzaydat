<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مزاد اللوحات السعودية</title>
    <link rel="stylesheet" href="css/auction-panel.css">
</head>
<body>
    <div class="container">
        <!-- Plates Section -->
        <header class="plates-header">
            <section class="card plates-preview">
                <h2>معاينة اللوحات</h2>
                
                <!-- Main Active Plate -->
                <div class="main-plate-section">
                    <div class="plate-item main-plate selected" data-plate="1">
                        <div class="plate-container">
                            <div class="plate-wrapper">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154.7 53" preserveAspectRatio="xMidYMid meet" class="plate-svg-wrapper">
                                    <image href="plate form/plate-template.svg" x="0" y="0" width="154.7" height="53" preserveAspectRatio="none" />
                                    <g class="plate-text-overlay" dominant-baseline="middle">
                                        <text id="overlayArabicNumbers1" x="28" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">۱۱۱۱</text>
                                        <text id="overlayArabicLetters1" x="118" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">أ ب ج</text>
                                        <text id="overlayEnglishNumbers1" x="28" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">-1111</text>
                                        <text id="overlayEnglishLetters1" x="118" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif">A B J</text>
                                    </g>
                                </svg>
                            </div>
                        </div>
                        <div class="plate-number">اللوحة النشطة - 1</div>
                    </div>
                </div>

                <!-- Smaller Plates Grid -->
                <div class="smaller-plates-grid">
                    <!-- Plate 2 -->
                    <div class="plate-item small-plate" data-plate="2">
                        <div class="plate-container">
                            <div class="plate-wrapper">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154.7 53" preserveAspectRatio="xMidYMid meet" class="plate-svg-wrapper">
                                    <image href="plate form/plate-template.svg" x="0" y="0" width="154.7" height="53" preserveAspectRatio="none" />
                                    <g class="plate-text-overlay" dominant-baseline="middle">
                                        <text id="overlayArabicNumbers2" x="28" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">۱۱۱۱</text>
                                        <text id="overlayArabicLetters2" x="118" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">أ ب ج</text>
                                        <text id="overlayEnglishNumbers2" x="28" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">-1111</text>
                                        <text id="overlayEnglishLetters2" x="118" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif">A B J</text>
                                    </g>
                                </svg>
                            </div>
                        </div>
                        <div class="plate-number">لوحة 2</div>
                    </div>

                    <!-- Plate 3 -->
                    <div class="plate-item small-plate" data-plate="3">
                        <div class="plate-container">
                            <div class="plate-wrapper">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154.7 53" preserveAspectRatio="xMidYMid meet" class="plate-svg-wrapper">
                                    <image href="plate form/plate-template.svg" x="0" y="0" width="154.7" height="53" preserveAspectRatio="none" />
                                    <g class="plate-text-overlay" dominant-baseline="middle">
                                        <text id="overlayArabicNumbers3" x="28" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">۱۱۱۱</text>
                                        <text id="overlayArabicLetters3" x="118" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">أ ب ج</text>
                                        <text id="overlayEnglishNumbers3" x="28" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">-1111</text>
                                        <text id="overlayEnglishLetters3" x="118" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif">A B J</text>
                                    </g>
                                </svg>
                            </div>
                        </div>
                        <div class="plate-number">لوحة 3</div>
                    </div>

                    <!-- Plate 4 -->
                    <div class="plate-item small-plate" data-plate="4">
                        <div class="plate-container">
                            <div class="plate-wrapper">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154.7 53" preserveAspectRatio="xMidYMid meet" class="plate-svg-wrapper">
                                    <image href="plate form/plate-template.svg" x="0" y="0" width="154.7" height="53" preserveAspectRatio="none" />
                                    <g class="plate-text-overlay" dominant-baseline="middle">
                                        <text id="overlayArabicNumbers4" x="28" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">۱۱۱۱</text>
                                        <text id="overlayArabicLetters4" x="118" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">أ ب ج</text>
                                        <text id="overlayEnglishNumbers4" x="28" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">-1111</text>
                                        <text id="overlayEnglishLetters4" x="118" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif">A B J</text>
                                    </g>
                                </svg>
                            </div>
                        </div>
                        <div class="plate-number">لوحة 4</div>
                    </div>

                    <!-- Plate 5 -->
                    <div class="plate-item small-plate" data-plate="5">
                        <div class="plate-container">
                            <div class="plate-wrapper">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154.7 53" preserveAspectRatio="xMidYMid meet" class="plate-svg-wrapper">
                                    <image href="plate form/plate-template.svg" x="0" y="0" width="154.7" height="53" preserveAspectRatio="none" />
                                    <g class="plate-text-overlay" dominant-baseline="middle">
                                        <text id="overlayArabicNumbers5" x="28" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">۱۱۱۱</text>
                                        <text id="overlayArabicLetters5" x="118" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">أ ب ج</text>
                                        <text id="overlayEnglishNumbers5" x="28" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#000000" font-family="Arial, Helvetica, sans-serif">-1111</text>
                                        <text id="overlayEnglishLetters5" x="118" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="2" fill="#000000" font-family="Arial, Helvetica, sans-serif">A B J</text>
                                    </g>
                                </svg>
                            </div>
                        </div>
                        <div class="plate-number">لوحة 5</div>
                    </div>
                </div>
            </section>
        </header>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Left Panel - Plate Information (70%) -->
            <aside class="panel left-panel">
                <section class="card">
                    <h2>معلومات اللوحة النشطة</h2>
                    <form id="plateForm">
                        <div class="selected-plate-indicator">
                            <span id="selectedPlateLabel">اللوحة النشطة: 1</span>
                        </div>
                        
                        <div class="conversion-toggle">
                            <label class="toggle-switch">
                                <input type="checkbox" id="autoConversionToggle">
                                <span class="toggle-slider"></span>
                                <span class="toggle-label">تحويل تلقائي من لوحة المفاتيح الإنجليزية</span>
                            </label>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="arabicLetters">الحروف العربية:</label>
                                <input type="text" id="arabicLetters" value="أ ب ج" maxlength="15" placeholder="أ ب ج">
                            </div>
                            <div class="form-group">
                                <label for="englishLetters">الحروف الإنجليزية:</label>
                                <input type="text" id="englishLetters" value="A B J" maxlength="15" placeholder="A B J">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="arabicNumbers">الأرقام العربية:</label>
                                <input type="text" id="arabicNumbers" value="۱۱۱۱" maxlength="10" placeholder="۱۱۱۱">
                            </div>
                            <div class="form-group">
                                <label for="englishNumbers">الأرقام الإنجليزية:</label>
                                <input type="text" id="englishNumbers" value="-1111" maxlength="10" placeholder="-1111">
                            </div>
                        </div>
                    </form>
                </section>

                <section class="card">
                    <h2>حالة المزاد</h2>
                    <div class="status-indicator">
                        <span class="status-label">الحالة:</span>
                        <span id="auctionStatus" class="status-value status-idle">خامل</span>
                    </div>
                </section>
            </aside>

            <!-- Right Panel - Auction Controls (30%) -->
            <aside class="panel right-panel">
                <section class="card">
                    <h2>تحكم المزاد</h2>
                    <div class="control-buttons">
                        <button id="startAuction" class="btn btn-primary">بدء المزاد</button>
                        <button id="pauseAuction" class="btn btn-warning" disabled>إيقاف المزاد</button>
                        <button id="resumeAuction" class="btn btn-success" disabled>استئناف المزاد</button>
                        <button id="endAuction" class="btn btn-danger" disabled>إنهاء المزاد</button>
                        <button id="resetAuction" class="btn btn-secondary">إعادة تعيين المزاد</button>
                    </div>
                </section>

                <section class="card">
                    <h2>معلومات المزايدة</h2>
                    <div class="bid-info">
                        <div class="bid-field">
                            <label>المزايدة الحالية:</label>
                            <span id="displayCurrentBid">ريال 0</span>
                        </div>
                        <div class="bid-field">
                            <label>الحد الأدنى للزيادة:</label>
                            <span id="displayMinIncrement">ريال 100</span>
                        </div>
                        <div class="bid-field">
                            <label>المزايد الحالي:</label>
                            <span id="displayBidder">-</span>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>تحكم المشغل</h2>
                    <div class="quick-actions">
                        <button id="quickBid" class="btn btn-quick">مزايدة سريعة +ريال 100</button>
                        <button id="quickBid500" class="btn btn-quick">مزايدة سريعة +ريال 500</button>
                        <button id="quickBid1000" class="btn btn-quick">مزايدة سريعة +ريال 1,000</button>
                    </div>
                </section>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auction-panel.js"></script>
</body>
</html>
