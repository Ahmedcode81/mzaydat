<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مزاد لوحات السيارات السعودية</title>
    <link rel="stylesheet" href="css/auction-panel.css">
</head>
<body>
    <div class="container">
        <!-- Top Plate Section -->
        <header class="plate-header">
            <section class="card plate-preview">
                <h2>معاينة حية</h2>
                <div class="plate-container">
                    <div class="plate-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 154.7 53" preserveAspectRatio="xMidYMid meet" class="plate-svg-wrapper">
                            <image href="plate form/plate-template.svg" x="0" y="0" width="154.7" height="53" preserveAspectRatio="none" />
                            <g class="plate-text-overlay" dominant-baseline="middle">
                                <text id="overlayArabicNumbers" x="28" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">۱۱۱۱</text>
                                <text id="overlayArabicLetters" x="118" y="15.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#000000" font-family="Arial, Helvetica, sans-serif" direction="rtl">أ ب ج</text>
                                <text id="overlayEnglishNumbers" x="28" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1" fill="#000000" font-family="Arial, Helvetica, sans-serif">-1111</text>
                                <text id="overlayEnglishLetters" x="118" y="37.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1" fill="#000000" font-family="Arial, Helvetica, sans-serif">A B J</text>
                            </g>
                        </svg>
                    </div>
                </div>
                <div class="timer-section">
                    <div class="timer-display" id="timerDisplay">
                        <span id="minutes">00</span>:<span id="seconds">00</span>
                    </div>
                    <div class="timer-controls">
                        <label for="timerDuration">المدة (دقائق):</label>
                        <input type="number" id="timerDuration" value="5" min="1" max="60">
                        <div class="timer-buttons">
                            <button id="startTimer" class="btn btn-timer">بدء المؤقت</button>
                            <button id="pauseTimer" class="btn btn-timer" disabled>إيقاف</button>
                            <button id="resumeTimer" class="btn btn-timer" disabled>استئناف</button>
                            <button id="resetTimer" class="btn btn-timer">إعادة تعيين</button>
                        </div>
                    </div>
                </div>
            </section>
        </header>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Left Panel - Plate Information (70%) -->
            <aside class="panel left-panel">
                <section class="card">
                    <h2>معلومات اللوحة</h2>
                    <form id="plateForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="plateCategory">فئة اللوحة:</label>
                                <select id="plateCategory">
                                    <option value="private">خاص</option>
                                    <option value="commercial">تجاري</option>
                                    <option value="government">حكومي</option>
                                    <option value="diplomatic">دبلوماسي</option>
                                    <option value="special">خاص</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="arabicLetters">الحروف العربية:</label>
                                <input type="text" id="arabicLetters" value="أ ب ج" maxlength="15" placeholder="أ ب ج">
                            </div>
                            <div class="form-group">
                                <label for="englishLetters">الحروف الإنجليزية:</label>
                                <input type="text" id="englishLetters" value="A B J" maxlength="15" placeholder="A B J">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="arabicNumbers">الأرقام العربية:</label>
                                <input type="text" id="arabicNumbers" value="۱۱۱۱" maxlength="10" placeholder="۱۱۱۱">
                            </div>
                            <div class="form-group">
                                <label for="englishNumbers">الأرقام الإنجليزية:</label>
                                <input type="text" id="englishNumbers" value="-1111" maxlength="10" placeholder="-1111">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="currentBid">المزايدة الحالية (ريال):</label>
                                <input type="number" id="currentBid" value="0" min="0" step="100">
                            </div>
                            <div class="form-group">
                                <label for="minIncrement">الحد الأدنى للزيادة (ريال):</label>
                                <input type="number" id="minIncrement" value="100" min="0" step="50">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="currentBidder">المزايد الحالي:</label>
                                <input type="text" id="currentBidder" placeholder="اسم المزايد أو المعرف">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="notes">ملاحظات:</label>
                                <textarea id="notes" rows="3" placeholder="ملاحظات إضافية..."></textarea>
                            </div>
                        </div>
                    </form>
                </section>

                <section class="card">
                    <h2>حالة المزاد</h2>
                    <div class="status-indicator">
                        <span class="status-label">الحالة:</span>
                        <span id="auctionStatus" class="status-value status-idle">خامل</span>
                    </div>
                    <div class="status-indicator">
                        <span class="status-label">رقم اللوحة:</span>
                        <span id="plateNumber" class="status-value">1</span>
                    </div>
                </section>

            </aside>

            <!-- Right Panel - Auction Controls (30%) -->
            <aside class="panel right-panel">
                <section class="card">
                    <h2>تحكم المزاد</h2>
                    <div class="control-buttons">
                        <button id="startAuction" class="btn btn-primary">بدء المزاد</button>
                        <button id="pauseAuction" class="btn btn-warning" disabled>إيقاف المزاد</button>
                        <button id="resumeAuction" class="btn btn-success" disabled>استئناف المزاد</button>
                        <button id="endAuction" class="btn btn-danger" disabled>إنهاء المزاد</button>
                        <button id="resetAuction" class="btn btn-secondary">إعادة تعيين المزاد</button>
                    </div>
                    <div class="navigation-buttons">
                        <button id="prevPlate" class="btn btn-nav">اللوحة السابقة</button>
                        <button id="nextPlate" class="btn btn-nav">اللوحة التالية</button>
                    </div>
                </section>

                <section class="card">
                    <h2>معلومات المزايدة</h2>
                    <div class="bid-info">
                        <div class="bid-field">
                            <label>المزايدة الحالية:</label>
                            <span id="displayCurrentBid">ريال 0</span>
                        </div>
                        <div class="bid-field">
                            <label>الحد الأدنى للزيادة:</label>
                            <span id="displayMinIncrement">ريال 100</span>
                        </div>
                        <div class="bid-field">
                            <label>المزايد الحالي:</label>
                            <span id="displayBidder">-</span>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>تحكم المشغل</h2>
                    <div class="quick-actions">
                        <button id="quickBid" class="btn btn-quick">مزايدة سريعة +ريال 100</button>
                        <button id="quickBid500" class="btn btn-quick">مزايدة سريعة +ريال 500</button>
                        <button id="quickBid1000" class="btn btn-quick">مزايدة سريعة +ريال 1,000</button>
                    </div>
                </section>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auction-panel.js"></script>
</body>
</html>
